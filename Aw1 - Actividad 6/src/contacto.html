<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto — Huellitas</title>
    <link rel="stylesheet" href="./recursos/estilo/index.css">
</head>

<body>
    <header class="encabezado-principal">
        <a href="./index.html">
            <img src="./recursos/imagenes/huella.png" alt="logo huellitas" width="80">
        </a>
        <nav>
            <a href="./index.html">Inicio</a>
            <a href="./contacto.html">contacto</a>
        </nav>
    </header>

    <main class="contenido-principal">
        <section>
            <h1>contacto</h1>
            <h2>Escribimos</h2>

            <form action="./contacto.html" method="post">
                <p>
                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre" id="nombre" required>
                </p>

                <p>
                    <label for="telefono">Telefono:</label>
                    <input type="tel" name="telefono" id="telefono">
                </p>

                <p>
                    <label for="id-tamaño-mascota">Tamaño de la mascota:</label>
                    <select name="tamaño-mascota" id="id-tamaño-mascota">
                        <option value="C">chico</option>
                        <option value="M">mediano</option>
                        <option value="G">grande</option>
                    </select>
                </p>

                <p>
                    <label for="edad">Edad:</label>
                    <input type="number" name="edad" id="edad">
                </p>

                <p>
                    <label for="comentario">Comentario / sobre la mascota:</label>
                    <textarea name="comentario" id="comentario" rows="4" cols="30"></textarea>
                </p>

                <p>
                    <button type="submit">Enviar</button>
                </p>
            </form>
        </section>

        <section>
            <h2>Donde estamos</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3404.7899732760334!2d-64.188!3d-31.417" width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </section>
    </main>

    <footer class="pie-pagina-sitio">
        <ul>
            <li>
                <a href="https://instagram.com/huellitas" target="_blank">@huellitas</a>
            </li>
            <li>Bv. San Juan 200 - Bº Nueva Cordoba</li>
        </ul>
    </footer>
</body>

</html>
