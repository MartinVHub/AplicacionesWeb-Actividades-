<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mariana López</title>
    <link rel="icon" href="./recursos/imagenes/pexels-markus-winkler-1430818-30945515.jpg" type="image/x-icon">
    <link rel="stylesheet" href="./recursos/estilos/index.css">
</head>

<body>

    <header class="cabecera-principal">
        <a href="./index.html" aria-label="Ir al Inicio">
            <img src="./recursos/imagenes/pexels-markus-winkler-1430818-30945515.jpg" alt="logo Mariana López">
        </a>
        <nav>
            <a href="./index.html">Quién soy / Servicios</a>
            <a href="./contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="contenido-principal">
        <h1>Contacto</h1>
        <p>Comencemos a trabajar juntos. Por favor, completa el siguiente formulario con tus datos de contacto:</p>

        <form action="#" method="POST" class="formulario-contacto">

            <div class="grupo-campo">
                <label for="nombre">Nombre completo del contacto:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="grupo-campo">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="grupo-campo">
                <label for="empresa">Nombre de la empresa:</label>
                <input type="text" id="empresa" name="empresa" required>
            </div>

            <div class="grupo-campo">
                <label for="rubro">Rubro o sector industrial:</label>
                <select id="rubro" name="rubro" required>
                    <option value="">Seleccione una opción...</option>
                    <option value="industria">Industria</option>
                    <option value="comercio">Comercio</option>
                    <option value="logistica">Logística</option>
                    <option value="servicios">Servicios</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div class="grupo-campo">
                <label for="motivo">Motivo de la consulta o necesidad principal:</label>
                <textarea id="motivo" name="motivo" rows="5" required></textarea>
            </div>

            <input type="submit" value="Enviar consulta" class="boton-enviar">
        </form>
    </main>

    <footer class="pie-principal">
        <ul>
            <li>
                <a href="https://instagram.com/@MarianaSustentable" target="_blank">@MarianaSustentable</a>
            </li>
            <li>Bv. San Juan 200 - Bº Nueva Córdoba</li>
        </ul>
    </footer>

    <a href="https://wa.me/5493510000000" class="boton-flotante" target="_blank" aria-label="Contactar por WhatsApp">
        💬
    </a>

</body>

</html>
